# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: codealpha-chatbot
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Paste your free Gemini key in the Render dashboard when asked (leave empty for the free local engine).
      - key: GEMINI_API_KEY
        sync: false
      - key: NOVA_ENGINE
        value: auto
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: RATE_LIMIT_PER_MIN
        value: "30"
